version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: icscsd2026-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: icscsd2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icscsd2026"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: icscsd2026-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/icscsd2026?schema=public"
      JWT_SECRET: "icscsd_2026_super_secret_jwt_key_vit_pune"
      CORS_ORIGIN: "http://localhost:3000"
      ADMIN_EMAIL: "admin@vit.edu"
      ADMIN_PASSWORD: "Admin@ICSCSD2026"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: icscsd2026-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
